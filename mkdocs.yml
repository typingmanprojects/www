site_name: typingman
site_url: https://typingman.com
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/typingmanprojects
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/typingman/
      name: LinkedIn
copyright: Copyright &copy; 2024 - 2025 typingman
nav:
  - Home: index.md
  - Projects: projects.md
  - Blog:
    - blog/index.md
  - About: about.md

theme:
  name: material
  custom_dir: overrides
  favicon: images/favicon.svg

  features:
    - navigation.instant
    - navigation.tabs

  logo: images/favicon.svg
  palette:
    scheme: slate
    primary: white
    accent: red

plugins:
  - search
  - blog

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences